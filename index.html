<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CODEX SUPERVISOR</title>
<style>
:root{--ink:#17211d;--paper:#f3f0e7;--green:#b8e4c5;--dark:#173c32;--lime:#dff36a;--coral:#f28b6d;--muted:#64736c;--rule:#bdc7bf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:28px}.mast{display:flex;gap:20px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:14px}.mast h1{font:800 28px Arial Narrow,Arial,sans-serif;letter-spacing:.1em;margin:0}.controls{margin-left:auto;display:flex;gap:8px}select,button{border:1px solid var(--ink);background:transparent;padding:9px 12px;font-weight:650}select{min-width:300px}button:hover{background:var(--lime)}.identity{font:12px ui-monospace;color:var(--muted);padding:10px 0 22px}.hero{display:grid;grid-template-columns:180px 1fr;gap:28px;align-items:center}.agent{width:150px;height:150px;background:var(--dark);position:relative;display:grid;place-items:center}.face{font:700 44px ui-monospace;color:var(--lime);letter-spacing:-8px;transform:translateX(-4px)}.antenna{position:absolute;width:3px;height:30px;background:var(--ink);top:-24px;left:74px}.antenna:after{content:'';position:absolute;width:12px;height:12px;background:var(--coral);top:-6px;left:-4px}.state{position:absolute;bottom:10px;color:white;font:700 13px/1 ui-monospace;letter-spacing:.1em}.speech{background:var(--green);padding:24px 28px;position:relative;min-height:150px}.speech:before{content:'';position:absolute;left:-24px;top:62px;border-width:14px 24px 14px 0;border-style:solid;border-color:transparent var(--green) transparent transparent}.eyebrow,.section-title,.metric b,.side h3{font:700 11px Arial Narrow,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}.speech h2{font:700 26px/1.16 Georgia,serif;margin:8px 0}.speech p{font:17px/1.45 Georgia,serif;margin:0}.strip{display:flex;margin:26px 0;border-block:1px solid var(--ink);overflow:auto}.metric{padding:14px 22px;border-right:1px solid var(--ink);min-width:180px}.metric:first-child{padding-left:0;min-width:250px}.metric b{display:block}.metric span{display:block;margin-top:4px;font:700 24px/1.08 Georgia,serif}.metric:first-child span{font-size:32px}.work{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:34px}.section-title{font-size:14px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin:0}.timeline{padding:10px 0}.event{display:grid;grid-template-columns:78px 112px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}.event time{font:12px ui-monospace;color:var(--muted)}.kind{font:700 11px Arial Narrow,Arial,sans-serif;text-transform:uppercase}.detail{font:13px/1.4 ui-monospace;word-break:break-word}.commentary .detail{font:16px/1.45 Georgia,serif}.commentary .kind{color:#16745c}.side section{padding:15px 0;border-bottom:1px solid var(--rule)}.side h3{margin:0 0 7px}.side div{font:16px/1.45 Georgia,serif;white-space:pre-wrap}.audit{margin-top:28px;border-top:2px solid var(--ink);padding-top:12px}.audit summary{cursor:pointer;font:700 12px ui-monospace}.audit pre{white-space:pre-wrap;max-height:300px;overflow:auto;background:#e7e3d8;padding:14px;font:11px/1.4 ui-monospace}.waiting{padding:28px 0;color:var(--muted);font:18px Georgia,serif}@media(max-width:760px){.shell{padding:18px}.mast{align-items:start;flex-direction:column}.controls{margin:0;width:100%;flex-wrap:wrap}select{min-width:0;flex:1}.hero{grid-template-columns:90px 1fr}.agent{width:80px;height:80px}.antenna{left:39px}.speech:before{top:25px}.speech h2{font-size:20px}.metric{min-width:155px}.metric:first-child{min-width:210px}.metric span{font-size:20px}.metric:first-child span{font-size:26px}.work{grid-template-columns:1fr}.event{grid-template-columns:62px 90px 1fr}}
</style>
<div class="shell"><header class="mast"><h1>CODEX SUPERVISOR</h1><div class="controls"><select id="task"></select><button id="observe">Observe</button><button id="refresh">Refresh</button></div></header><div class="identity" id="identity">No task attached</div><section class="hero"><div class="agent"><i class="antenna"></i><div class="face">•‿•</div><div class="state" id="agentState">WAITING</div></div><div class="speech"><div class="eyebrow">Supervisor says</div><h2 id="headline">Choose a task to begin.</h2><p id="assessment">I’ll translate visible Codex activity into a concise, evidence-backed update.</p></div></section><div class="strip" id="strip"></div><main class="work"><section><h2 class="section-title">Live evidence</h2><div class="timeline" id="timeline"></div></section><aside class="side" id="side"></aside></main><details class="audit"><summary>Inspect exact local-LLM input and response</summary><h3>Evidence batch</h3><pre id="evidence">No batch yet.</pre><h3>Ollama response</h3><pre id="interpretation">No response yet.</pre></details></div>
<script>
let state={},pending='';const task=document.querySelector('#task');const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');async function load(){state=await(await fetch('/api/state')).json();const options=(state.threads||[]).map(x=>`<option value="${x.id||x.threadId}">${esc(x.name||x.title||x.id||x.threadId)}</option>`).join('');if(task.innerHTML!==options)task.innerHTML=options;if(pending)task.value=pending;else if(state.connected)task.value=state.connected;render()}async function attach(){pending=task.value;await fetch('/api/attach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({threadId:pending})});pending='';load()}function useful(label,value){if(value==null||value===''||(Array.isArray(value)&&!value.length))return'';return`<section><h3>${label}</h3><div>${esc(Array.isArray(value)?value.join('\n'):value)}</div></section>`}function render(){identity.textContent=state.connected?`${state.observedName} · ${state.connected} · ${state.observedPath}`:'No task attached';agentState.textContent=state.status||'WAITING';headline.textContent=state.currentAction||((state.events||[]).length?'I’m reading the latest activity.':'Waiting for visible activity…');assessment.textContent=state.assessment||'No interpreted summary yet. Raw evidence will appear below as Codex works.';strip.innerHTML=[['Status',state.status],['Needs Jeremy?',state.needsUser],['Scope drift',state.scopeDrift],['Latest evidence',state.lastEventAt||'Waiting']].map(x=>`<div class=metric><b>${x[0]}</b><span>${esc(x[1]||'—')}</span></div>`).join('');timeline.innerHTML=(state.events||[]).length?(state.events||[]).map(e=>`<article class="event ${esc(e.kind)}"><time>${esc(e.time)}</time><div class=kind>${esc(e.kind)}</div><div class=detail>${esc(e.detail)}</div></article>`).join(''):'<div class=waiting>Waiting for commentary, edits, commands, or test results…</div>';side.innerHTML=useful('Objective',state.objective)+useful('Progress',state.progress)+useful('Files observed',state.filesChanged)+useful('Tests',state.tests)+useful('Blocker',state.blocker)+useful('Next expected action',state.nextAction)+useful('Suggested steering',state.steering);evidence.textContent=state.lastEvidence||'No batch yet.';interpretation.textContent=state.lastInterpretation||'No response yet.'}task.addEventListener('change',attach);observe.onclick=attach;refresh.onclick=async()=>{await fetch('/api/refresh',{method:'POST'});load()};load();setInterval(load,2000);
</script>
<script>
const focusedRender=render;render=function(){const original=state.events;state.events=(original||[]).map(e=>e.kind==='worker/final'?{...e,kind:'commentary'}:e);focusedRender();state.events=original}
</script>
<script>
render=function(){identity.textContent=state.connected?`${state.observedName} · ${state.connected} · ${state.observedPath}`:'No task attached';agentState.textContent=state.status||'WAITING';headline.textContent=state.currentAction||((state.events||[]).length?'I’m reading the latest activity.':'Waiting for visible activity…');assessment.textContent=state.assessment||'No interpreted summary yet. Evidence will appear below as Codex works.';strip.innerHTML=[['Status',state.status],['Needs Jeremy?',state.needsUser],['Scope drift',state.scopeDrift],['Latest evidence',state.lastEventAt||'Waiting']].map(x=>`<div class=metric><b>${x[0]}</b><span>${esc(x[1]||'—')}</span></div>`).join('');const visible=(state.events||[]).filter(e=>['commentary','build/progress','test/result','watcher/error'].includes(e.kind)).slice(0,16);timeline.innerHTML=visible.length?visible.map(e=>`<article class="event ${esc(e.kind)}"><time>${esc(e.time)}</time><div class=kind>${esc(e.kind.replace('/',' '))}</div><div class=detail>${esc(e.detail)}</div></article>`).join(''):'<div class=waiting>Waiting for a meaningful commentary, milestone, test result, or error…</div>';side.innerHTML=useful('Objective',(state.objective||'').slice(0,900))+useful('Progress',state.progress)+useful('Files observed',state.filesChanged)+useful('Tests',state.tests)+useful('Blocker',state.blocker)+useful('Next expected action',state.nextAction)+useful('Suggested steering',state.steering);evidence.textContent=state.lastEvidence||'No batch yet.';interpretation.textContent=state.lastInterpretation||'No response yet.'}
</script>
