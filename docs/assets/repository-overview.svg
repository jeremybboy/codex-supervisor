<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
 <title id="title">Codex Supervisor read-only observation flow</title><desc id="desc">A coding agent produces a local activity feed. A read-only adapter selects externally visible events, a deterministic interpreter removes repetition and identifies state, and a local browser presents a human summary.</desc>
 <rect width="1120" height="360" fill="#f3f0e7"/><text x="48" y="54" fill="#17211d" font-family="Arial" font-size="26" font-weight="700" letter-spacing="3">SEE THE WORK WITHOUT READING THE WALL</text>
 <g font-family="Arial" fill="#17211d" font-size="13" font-weight="700"><text x="48" y="102">01 · WORKER</text><text x="265" y="102">02 · OBSERVE</text><text x="500" y="102">03 · DISTILL</text><text x="755" y="102">04 · EXPLAIN</text></g>
 <rect x="48" y="122" width="170" height="128" fill="#173c32"/><text x="70" y="164" fill="#dff36a" font-family="monospace" font-size="18">commentary</text><text x="70" y="195" fill="#fff" font-family="monospace" font-size="14">edits · tests</text><text x="70" y="222" fill="#fff" font-family="monospace" font-size="14">commands · errors</text>
 <path d="M218 186H258M249 178L258 186 249 194" fill="none" stroke="#17211d" stroke-width="3"/><rect x="265" y="122" width="188" height="128" fill="#b8e4c5"/><text x="287" y="164" font-family="Arial" font-size="18" font-weight="700">Read-only adapter</text><text x="287" y="195" font-family="Georgia" font-size="15">Visible events only</text><text x="287" y="222" font-family="Georgia" font-size="15">No worker control</text>
 <path d="M453 186H493M484 178L493 186 484 194" fill="none" stroke="#17211d" stroke-width="3"/><rect x="500" y="122" width="208" height="128" fill="#dff36a"/><text x="522" y="164" font-family="Arial" font-size="18" font-weight="700">Evidence filter</text><text x="522" y="195" font-family="Georgia" font-size="15">Deduplicate · classify</text><text x="522" y="222" font-family="Georgia" font-size="15">Detect user decisions</text>
 <path d="M708 186H748M739 178L748 186 739 194" fill="none" stroke="#17211d" stroke-width="3"/><rect x="755" y="122" width="317" height="128" fill="#f28b6d"/><text x="780" y="164" font-family="Arial" font-size="20" font-weight="700">Human-readable supervisor</text><text x="780" y="195" font-family="Georgia" font-size="16">What happened · What changed</text><text x="780" y="222" font-family="Georgia" font-size="16">What is blocked · Do I need to act?</text>
 <path d="M604 250V304H755" fill="none" stroke="#64736c" stroke-width="2" stroke-dasharray="7 6"/><rect x="755" y="280" width="317" height="48" fill="none" stroke="#64736c" stroke-width="2"/><text x="777" y="310" fill="#64736c" font-family="monospace" font-size="13">OPTIONAL LOCAL MODEL · OFF BY DEFAULT</text>
</svg>
